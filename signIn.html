<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignIn Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background: linear-gradient( #43cea2, #185a9d);">

    <div class="main-container">
        <div class="welcome-section">
            <h1>Welcome to BuyNow 🛒</h1>
            <p>
                Your one-stop destination for <b>easy</b>, <b>fast</b> and <b>secure</b> online shopping.
            </p>
            <p>
                Signin today and enjoy the best deals, offers and smooth shopping experience!
            </p>
        </div>

        <div class="signup-box">

        </div>
    </div>
    <div class="signup-container">
        <h2>Create Account</h2>
        <p class="subtitle">Join our online platform</p>

        <form id="signupForm" onsubmit="validateForm()">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">

            <label>Email Address</label>
            <input type="text" id="email" placeholder="Enter your email">

            <label>Mobile Number</label>
            <input type="text" id="mobile" placeholder="Enter your mobile number">

            <label>Password</label>
            <input type="password" id="password" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">

            <button type="submit">Sign In</button>

            <p>or signin with</p>

            <div class="social-login">

                <img class="logo" src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google" />
                <img class="logo" src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub" />
                <img class="logo" src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt="Apple" />
                <img class="logo" src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" />

            </div>
        </form>
        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
        </form>
    </div>
    <script src="SignIn.js"> 
    </script>
</body>

</html>
